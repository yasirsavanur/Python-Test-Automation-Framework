[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-qa-framework"
version = "2.0.0"
description = "A production-minded Selenium and pytest automation framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yasir Savanur"}]
dependencies = [
    "selenium>=4.20,<5",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "pytest-html>=4,<5",
    "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "api: service-level contract tests",
    "regression: broader behavioural coverage",
    "smoke: critical user journeys",
    "ui: browser-based Selenium tests",
    "unit: isolated framework tests",
]

[tool.coverage.run]
branch = true
source = ["automation_framework"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
