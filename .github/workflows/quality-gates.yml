name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework:
    name: Framework / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Lint
        run: ruff check .
      - name: Run API and unit tests
        run: >-
          pytest -m "api or unit"
          --junitxml=artifacts/framework.xml
      - name: Upload framework reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-python-${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: ignore

  selenium:
    name: Selenium / ${{ matrix.browser }}
    needs: framework
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Run browser tests
        run: >-
          pytest
          --browser=${{ matrix.browser }}
          --cov=automation_framework
          --cov-report=term-missing
          --cov-report=xml:artifacts/coverage-${{ matrix.browser }}.xml
          --junitxml=artifacts/ui-${{ matrix.browser }}.xml
          --html=artifacts/ui-${{ matrix.browser }}.html
          --self-contained-html
      - name: Upload browser reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-${{ matrix.browser }}
          path: artifacts/
          if-no-files-found: ignore
